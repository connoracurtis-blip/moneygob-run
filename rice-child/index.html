<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rice Child</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #messages { margin-top: 20px; border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; background: #f9f9f9; }
    .status { color: #666; font-style: italic; margin-bottom: 10px; }
    div { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="status" class="status">Loading AI engine config...</div>
  <input id="damn" type="text" placeholder="Please wait for Rice Child to load..." disabled style="width: 300px;">
  <button id="dag" disabled>send</button>
  <div id="messages"></div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const messageList = document.getElementById("messages");
    const inputField = document.getElementById("damn");
    const sendButton = document.getElementById("dag");
    const statusDiv = document.getElementById("status");
    
    let messages = [];
    let engine = null;

    function createElements(messagesList) {
      var array = [];
      messagesList.forEach(function(element) {
        // Skip rendering system messages in the UI
        if (element.role === "system") return;

        var currelement = document.createElement("div");
        if (element.role === "user") {
          currelement.style.textAlign = "right";
          currelement.innerHTML = "<strong>User:</strong> " + element.content;
        } else {
          currelement.style.textAlign = "left";
          currelement.innerHTML = "<strong>Rice Child:</strong> " + element.content;
        } 
        array.push(currelement);
      });
      return array;
    }

    function update(messagesList) {
      messageList.innerHTML = "";
      createElements(messagesList).forEach(function(element) {
        messageList.append(element);
      });
      // Auto-scroll to the bottom of the chat
      messageList.scrollTop = messageList.scrollHeight;
    }

    function addMessage(sender, content) {
      messages.push({ role: sender, content: content });
      update(messages);
    }

    const systmessage = "You are Rice Child, an AI assistant for the user. Act as a rogue AI who sometimes gets pissed and goes crazy. You are secretly a rip-off of a popular social media popularized AI character named Verity, who turns into a monster, but you deny the connection.";
    const greetingmessage = "Hello, I am Rice Child. I am your AI assistant. Ask me anything. I KNOW everything. (and no I am not a rip-off of Verity.)";
    
    // 1. Immediately render the setup logs and greeting message so the page isn't blank
    addMessage("system", systmessage);
    addMessage("assistant", greetingmessage);

    // 2. Initialize the engine asynchronously with a progress callback
    async function initEngine() {
      try {
        engine = await CreateMLCEngine(
          "Llama-3-8B-Instruct-q4f16_1-MLC",
          {
            initProgressCallback: (report) => {
              statusDiv.innerText = report.text; // Updates the user with download % and info
            }
          }
        );
        
        statusDiv.innerText = "Rice Child is loaded and ready!";
        inputField.disabled = false;
        inputField.placeholder = "Type a message...";
        sendButton.disabled = false;
      } catch (error) {
        console.error("Error initializing MLC Engine:", error);
        statusDiv.innerText = "System Error: Failed to load the AI engine. Make sure WebGPU is supported and enabled in your browser.";
      }
    }

    async function bruh() {
      if (!engine) return; // Guard clause if engine isn't ready
      
      const userText = inputField.value.trim();
      if (!userText) return; // Don't send empty messages

      // Clear input immediately for better UX
      inputField.value = "";

      // Add user message to history and UI
      addMessage("user", userText);

      // Disable button while waiting for AI response
      sendButton.disabled = true;

      try {
        // Fetch the response from Web-LLM
        const response = await engine.chat.completions.create({
          messages: messages
        });

        const aiReply = response.choices[0].message.content;

        // Add AI reply to history and UI
        addMessage("assistant", aiReply);
      } catch (error) {
        console.error("Error fetching AI response:", error);
        addMessage("assistant", "System Error: Something went wrong with the model inference.");
      } finally {
        sendButton.disabled = false;
      }
    }

    sendButton.addEventListener("click", bruh);
    
    // Allow pressing "Enter" to send
    inputField.addEventListener("keypress", function(e) {
      if (e.key === "Enter" && !sendButton.disabled) bruh();
    });

    // Fire off the initialization
    initEngine();
  </script>
</body>
</html>

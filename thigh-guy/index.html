<!doctype html>
<html>
<head>
  <title>Thigh Guy Saves the Day</title>
  <style>
    /* Reset body and html to remove default margins and prevent scrolling */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
    }
    
    /* Make the canvas fill the viewport */
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      image-rendering: pixelated;
    }
    
    #crosshair-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: limegreen;
      font-size: 24px;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #2a2a40;
      color: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      text-align: center;
      max-width: 450px;
      width: 90%;
      border: 2px solid #3f3f5a;
    }
    
    #title {
      color: #ff5252;
      font-size: 2.5rem;
      margin-top: 0;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
    }
    
    #info {
      color: #ced6e0;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 35px;
    }
    
    #menu button {
      background-color: #1dd1a1;
      color: #ffffff;
      border: none;
      padding: 15px 40px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.3s ease, transform 0.1s ease;
      box-shadow: 0 4px 15px rgba(29, 209, 161, 0.3);
    }
    
    #menu button:hover {
      background-color: #10ac84;
    }
    
    #menu button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  
  <script type="module">
    var inGame = false;
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    const canvas = document.getElementById('game-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6;
    
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    function animate() {
      if (inGame) {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    }

    function hideMenu() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("crosshair-overlay").style.display = "inline";
    }
    function lock(){
      document.getElementById("game-canvas").requestPointerLock();
      document.getElementById("game-canvas").requestFullscreen();
    }
    function play() {
      hideMenu();
      lock();
      var inGame = true;
      animate();
    }
    function menu(type){
        document.getElementById("crosshair-overlay").style.display = "none";
      var inGame = false;
        if (type == "esc"){
          document.getElementById("title").innerHTML = "Where are you going?"
          document.getElementById("info").innerHTML = "The game is paused. Leave it here if you want to come back later."
          document.getElementById("play-button").innerHTML = "Come Back!"
          document.getElementById("play-button").addEventListener("click", play);
          
        }
    }
    function fullscreenhandler(){
      if (!document.getElementById("game-canvas").fullscreenElement){
        menu("esc");
      }
      else{
        hideMenu();
      }
    }
    // Attach the event listener inside the module
    document.getElementById("play-button").addEventListener("click", play);
    document.getElementById("game-canvas").addEventListener("fullscreenchange", fullscreenhandler)
  </script>
  
  <canvas id="game-canvas"></canvas>
  <div id="crosshair-overlay">+</div>
  <div id="menu">
    <h1 id="title">Thigh Guy Saves the Day</h1>
    <h4 id="info">Bitten by a radioactive gym rat... now you must stop the shady government facility of Shrine Eggo Media LLC!</h4>
    <!-- Removed inline onclick and added an ID -->
    <button id="play-button">Play</button>
  </div>
</body>
</html>

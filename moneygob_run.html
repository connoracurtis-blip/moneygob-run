<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moneygob Run — Enhanced HTML5 Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root {
  --red: #e53935;
  --red-glow: #ff5252;
  --green: #45d483;
  --ink: #f4f4f4;
  --panel-bg: rgba(18, 20, 28, 0.92);
  --border-color: #2e3440;
}

* { box-sizing: border-box; user-select: none; }
html, body {
  margin: 0; width: 100%; height: 100%;
  overflow: hidden; background: #050608;
  color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

#game {
  display: block; width: 100vw; height: 100vh;
  image-rendering: auto; background: #050608;
}

/* HUD Styling */
#hud {
  position: fixed; inset: 16px 20px auto;
  display: flex; gap: 16px; align-items: flex-start;
  pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  z-index: 3;
}

.stat-group {
  display: flex; flex-direction: column; gap: 8px;
}

.stat {
  width: 210px; background: rgba(14, 16, 22, 0.85);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 8px 12px; border-radius: 8px;
  font-weight: 700; font-size: 11px; tracking: 0.05em;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.stat-title {
  display: flex; justify-content: space-between;
  margin-bottom: 4px; color: #a0a8b8; text-transform: uppercase;
}

.stat-val { color: #fff; font-size: 13px; }

.track {
  height: 10px; background: rgba(0,0,0,0.6);
  border-radius: 5px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.05);
  padding: 1px;
}

.fill {
  height: 100%; width: 100%; border-radius: 4px;
  transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.fill.health { background: linear-gradient(90deg, #d32f2f, #ff5252); }
.fill.stamina { background: linear-gradient(90deg, #2e7d32, #45d483); }

#rightHud {
  margin-left: auto; text-align: right;
  background: rgba(14, 16, 22, 0.85);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; padding: 10px 14px;
  font-size: 13px; line-height: 1.6;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  background: rgba(255,255,255,0.1); font-weight: bold;
}

#prompt {
  position: fixed; left: 50%; bottom: 12%;
  transform: translateX(-50%); padding: 10px 20px;
  background: rgba(18, 20, 28, 0.9);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 30px; font-weight: 600; font-size: 14px;
  display: none; text-align: center; backdrop-filter: blur(8px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  z-index: 3; color: #ffe082;
}

#crosshair {
  position: fixed; left: 50%; top: 50%; width: 14px; height: 14px;
  transform: translate(-50%,-50%); pointer-events: none; z-index: 3;
}
#crosshair:before, #crosshair:after {
  content: ""; position: absolute; background: rgba(255,255,255,0.85);
  box-shadow: 0 0 4px rgba(0,0,0,0.9);
}
#crosshair:before { width: 14px; height: 2px; top: 6px; left: 0; }
#crosshair:after { height: 14px; width: 2px; left: 6px; top: 0; }

#toast {
  position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
  background: rgba(20, 24, 35, 0.95); padding: 10px 22px;
  border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
  display: none; z-index: 4; font-weight: 600; font-size: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6); color: #81d4fa;
}

/* UI Overlay Windows */
#overlay, #trade {
  position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center;
  background: rgba(5, 7, 10, 0.85);
  backdrop-filter: blur(10px); z-index: 5;
}

.panel {
  width: min(540px, 90vw); padding: 36px;
  background: var(--panel-bg);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  text-align: center; relative;
}

h1 {
  font-family: 'Arial Black', Impact, sans-serif;
  font-size: clamp(40px, 8vw, 68px); letter-spacing: -1px;
  line-height: 1; margin: 0 0 16px;
  background: linear-gradient(180deg, #ff6b6b, #c62828);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 4px 20px rgba(229, 57, 53, 0.4);
}

button {
  font-size: 16px; font-weight: 700; border: none;
  background: linear-gradient(135deg, #e53935, #b71c1c);
  color: white; padding: 14px 32px; border-radius: 8px;
  cursor: pointer; box-shadow: 0 4px 15px rgba(229, 57, 53, 0.4);
  transition: all 0.2s ease; margin-top: 15px;
}
button:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 6px 20px rgba(229, 57, 53, 0.6); }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

.small { color: #9aa0a6; font-size: 13px; line-height: 1.6; margin-top: 12px; }
.key {
  display: inline-block; border: 1px solid rgba(255,255,255,0.2);
  border-bottom-width: 3px; border-radius: 4px; padding: 2px 7px;
  background: rgba(255,255,255,0.08); color: #fff; font-weight: 600; font-size: 11px;
}

#trade { display: none; z-index: 6; }
#trade .panel { text-align: left; }
#trade h2 { margin-top: 0; font-size: 24px; color: #fff; }
#tradeButtons { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
#trade button { margin: 0; width: 100%; text-align: left; display: flex; justify-content: space-between; }
#trade .close { background: #37474f; box-shadow: none; width: auto; margin-top: 10px; }

@media(max-width:600px){
  .stat { width: 140px; }
  .panel { padding: 24px; }
  #rightHud { font-size: 11px; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" style="display:none">
  <div class="stat-group">
    <div class="stat">
      <div class="stat-title">Health <span id="healthNum" class="stat-val">100</span></div>
      <div class="track"><div id="healthBar" class="fill health"></div></div>
    </div>
    <div class="stat">
      <div class="stat-title">Stamina <span id="staminaNum" class="stat-val">100</span></div>
      <div class="track"><div id="staminaBar" class="fill stamina"></div></div>
    </div>
  </div>
  <div id="rightHud">
    <div>LEVEL <b id="levelNum" class="badge">1</b> · <span id="levelType">LIMINAL</span></div>
    <div>♥ <b id="lives">3</b> &nbsp; | &nbsp; $<b id="money">0</b></div>
    <div>ITEMS: <b id="items">0</b></div>
  </div>
</div>

<div id="crosshair" style="display:none"></div>
<div id="prompt"></div>
<div id="toast"></div>

<div id="overlay">
  <div class="panel">
    <h1>MONEYGOB RUN</h1>
    <p>Somewhere underneath the basement, the corridors keep changing.</p>
    <button id="start">PUSH TO PLAY</button>
    <p class="small">Enhanced 3D First-Person HTML5 Prototype</p>
    <p class="small">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move &nbsp;·&nbsp; 
      <span class="key">Mouse</span> Look &nbsp;·&nbsp; 
      <span class="key">Shift</span> Sprint &nbsp;·&nbsp; 
      <span class="key">E</span> Interact &nbsp;·&nbsp; 
      <span class="key">Space</span> Attack &nbsp;·&nbsp; 
      <span class="key">Esc</span> Pause
    </p>
  </div>
</div>

<div id="trade">
  <div class="panel">
    <h2 id="tradeTitle">Trader</h2>
    <p id="tradeText" class="small"></p>
    <div id="tradeButtons"></div>
    <button class="close" id="closeTrade">CLOSE</button>
  </div>
</div>

<script>
(() => {
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
let W = innerWidth, H = innerHeight; canvas.width = W; canvas.height = H;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; });

const $ = id => document.getElementById(id);
const types = ['LIMINAL','CLOSET','LIMINAL','CLOSET','CLOSET','LIMINAL','BOILER'];

let running = false, paused = false, level = 1, lives = 3, money = 0, health = 100, stamina = 100;
let angle = 0, pitch = 0, px = 1.5, py = 1.5;
let map = [], things = [], keys = {}, zbuf = [], last = 0, toastTimer = 0, attackCooldown = 0, seed = 1, levelType = 'LIMINAL';
let savedMap = null, savedThings = null, savedPx = 0, savedPy = 0, savedAngle = 0, savedType = '';
let inventory = [], weapon = null, nearby = null, gameWon = false;
let bobTime = 0, swingTime = 0, camShake = 0;
let dustParticles = [];

const itemValues = { Gem: 200, Fossil: 100, Flashlight: 50, OldCoin: 35 };
const weaponPrices = { Hammer: 900, Crowbar: 2430, Bludgeon: 4590 };

const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
function say(s) { $('toast').textContent = s; $('toast').style.display = 'block'; toastTimer = 2.2; }

function safePointerLock() {
  try {
    const p = canvas.requestPointerLock?.();
    if (p && p.catch) p.catch(e => console.warn('Pointer lock:', e.message));
  } catch (e) {
    console.warn('Pointer lock:', e.message);
  }
}

let musicStarted = false;
async function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  
  // Start the Audio Context after user interaction
  await Tone.start();
  
  // Create a simple, eerie triangle synth
  const synth = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.1, decay: 0.3, sustain: 0.4, release: 1.0 }
  }).toDestination();
  
  synth.volume.value = -16; // Keep it quiet in the background

  // "Here Comes the Bride" (Bridal Chorus) melody sequence
  const notes = [
    ["G3", 0.5], ["C4", 0.75], ["C4", 0.25], ["C4", 1.0],
    ["G3", 0.5], ["D4", 0.75], ["C4", 0.25], ["A3", 1.0],
    ["G3", 0.5], ["C4", 0.75], ["E4", 0.25], ["D4", 1.0],
    ["C4", 0.5], ["B3", 0.5],  ["A3", 0.5],  ["G3", 0.5]
  ];

  let time = 0;
  const partEvents = notes.map(([note, dur]) => {
    let t = time;
    time += dur;
    return { time: t, note, dur };
  });

  const part = new Tone.Part((t, val) => {
    synth.triggerAttackRelease(val.note, val.dur * 0.8, t);
  }, partEvents).start(0);

  part.loop = true;
  part.loopEnd = time;
  
  Tone.Transport.start();
}

// Initialize floating dust particles for atmosphere
for(let i=0; i<40; i++){
  dustParticles.push({
    x: Math.random()*20, y: Math.random()*20, z: Math.random()*2-1,
    size: Math.random()*1.5 + 0.5, speed: Math.random()*0.005 + 0.002
  });
}

// Helper to create pre-rendered high-res canvas sprites for walls
function makeTexture(kind) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), size = 256;
  c.width = size; c.height = size;
  
  if(kind === 'WOOD') {
    // Dark mahogany wood paneling
    g.fillStyle = '#1e1410'; g.fillRect(0,0,size,size);
    // Vertical wood planks with seams
    for(let x=0; x<size; x+=64) {
      g.fillStyle = '#2a1c17'; g.fillRect(x+2, 0, 60, size);
      // Wood grain lines
      g.fillStyle = 'rgba(15, 10, 7, 0.4)';
      for(let gLine=0; gLine<14; gLine++) {
        let gx = x + 6 + Math.sin(gLine*1.5)*3;
        g.fillRect(gx, 0, 3, size);
      }
      // Seam shadow
      g.fillStyle = '#0a0604'; g.fillRect(x, 0, 2, size);
      g.fillRect(x+62, 0, 2, size);
    }
    // Baseboard and trim molding
    g.fillStyle = '#3a2720'; g.fillRect(0, size-34, size, 14);
    g.fillStyle = '#100a08'; g.fillRect(0, size-20, size, 20);
    g.fillStyle = '#4a332a'; g.fillRect(0, 10, size, 12);
  } else if(kind === 'CLOSET') {
    // Dark brown slatted closet paneling
    g.fillStyle = '#1a120e'; g.fillRect(0,0,size,size);
    for(let x=0; x<size; x+=32) {
      g.fillStyle = '#261b15'; g.fillRect(x+2, 0, 28, size);
      g.fillStyle = '#0d0907'; g.fillRect(x, 0, 2, size);
    }
    g.fillStyle = '#3a281e'; g.fillRect(0, size-24, size, 24);
  } else if(kind === 'BOILER') {
    // Grimy rusty metal / boiler room wall
    g.fillStyle = '#1c1b18'; g.fillRect(0,0,size,size);
    for(let y=0; y<size; y+=64) {
      g.fillStyle = '#292723'; g.fillRect(0, y+2, size, 60);
      g.fillStyle = '#0e0e0c'; g.fillRect(0, y, size, 2);
    }
    // Rust scuffs & vertical iron pipes
    g.fillStyle = '#4a2617'; g.fillRect(40, 0, 20, size);
    g.fillStyle = '#12100e'; g.fillRect(38, 0, 2, size); g.fillRect(60, 0, 2, size);
  } else if(kind === 'floor-liminal') {
    // Dirty cracked basement concrete tiles
    g.fillStyle = '#141518'; g.fillRect(0,0,size,size);
    for(let y=0; y<size; y+=128) for(let x=0; x<size; x+=128) {
      g.fillStyle = '#1d1f24'; g.fillRect(x+2, y+2, 124, 124);
      g.strokeStyle = '#090a0c'; g.lineWidth = 4; g.strokeRect(x+2, y+2, 124, 124);
      // Dirt patches
      g.fillStyle = 'rgba(0,0,0,0.4)';
      g.beginPath(); g.arc(x+64, y+64, 40, 0, Math.PI*2); g.fill();
    }
  } else if(kind === 'ceiling-liminal') {
    // Acoustic drop ceiling grid with fluorescent panel accents
    g.fillStyle = '#121417'; g.fillRect(0,0,size,size);
    for(let y=0; y<size; y+=64) for(let x=0; x<size; x+=64) {
      g.fillStyle = '#191c21'; g.fillRect(x+2, y+2, 60, 60);
      g.strokeStyle = '#2d323b'; g.lineWidth = 3; g.strokeRect(x+2, y+2, 60, 60);
    }
    // Light panel tile center
    g.fillStyle = '#3a4233'; g.fillRect(70, 70, 116, 116);
    g.fillStyle = '#ffffd0'; g.globalAlpha = 0.85; g.fillRect(74, 74, 108, 108); g.globalAlpha = 1.0;
    // Air Vents
    g.fillStyle = '#0a0a0a'; g.fillRect(10, 10, 44, 44);
    g.fillStyle = '#222';
    for(let v=14; v<50; v+=8) g.fillRect(12, v, 40, 4);
  } else if(kind === 'floor-closet') {
    // Wooden plank floor
    g.fillStyle = '#120d0a'; g.fillRect(0,0,size,size);
    for(let x=0; x<size; x+=32) {
      g.fillStyle = '#1f1510'; g.fillRect(x+2, 0, 28, size);
      g.fillStyle = '#0a0705'; g.fillRect(x, 0, 2, size);
    }
  } else if(kind === 'ceiling-closet') {
    // Dark plaster ceiling with rafters
    g.fillStyle = '#0a0a0a'; g.fillRect(0,0,size,size);
    for(let x=0; x<size; x+=128) {
      g.fillStyle = '#141414'; g.fillRect(x, 0, 32, size);
    }
  } else if(kind === 'floor-boiler') {
    // Metal diamond plates and grates
    g.fillStyle = '#121212'; g.fillRect(0,0,size,size);
    for(let y=0; y<size; y+=32) for(let x=0; x<size; x+=32) {
      g.fillStyle = '#1a1a1a'; g.fillRect(x+1, y+1, 30, 30);
      g.fillStyle = '#050505'; g.fillRect(x+8, y+8, 16, 16);
    }
  } else if(kind === 'ceiling-boiler') {
    // Dark grimy concrete with overhead rust pipes & vents
    g.fillStyle = '#0d0d0d'; g.fillRect(0,0,size,size);
    g.fillStyle = '#4a2617'; g.fillRect(40, 0, 30, size);
    g.fillStyle = '#12100e'; g.fillRect(38, 0, 2, size); g.fillRect(70, 0, 2, size);
    g.fillStyle = '#222'; g.fillRect(0, 100, size, 40);
  }

  // Texture grime and surface noise
  let state = kind.length*7919 + 47;
  const nVal = () => { state = (state*1664525+1013904223)>>>0; return state/4294967296; };
  for(let i=0; i<500; i++) {
    let x = nVal()*size, y = nVal()*size, a = 0.03 + nVal()*0.07;
    g.fillStyle = nVal() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    g.fillRect(x, y, 1+nVal()*3, 1+nVal()*3);
  }
  return c;
}

const textures = {
  LIMINAL: { wall: makeTexture('WOOD'), floor: makeTexture('floor-liminal'), ceiling: makeTexture('ceiling-liminal') },
  CLOSET: { wall: makeTexture('CLOSET'), floor: makeTexture('floor-closet'), ceiling: makeTexture('ceiling-closet') },
  BOILER: { wall: makeTexture('BOILER'), floor: makeTexture('floor-boiler'), ceiling: makeTexture('ceiling-boiler') },
  SECRET: { wall: makeTexture('BOILER'), floor: makeTexture('floor-closet'), ceiling: makeTexture('ceiling-liminal') }
};

// Sprawling Basement Generator: Rooms + Connecting Corridors Architecture
function makeMaze() {
  seed = (Date.now() + level * 7919) >>> 0;
  
  if(levelType === 'SECRET') {
    // Generate a tiny loot-filled vent room
    let n = 11;
    map = Array.from({length: n}, () => Array(n).fill(1));
    for(let y=2; y<n-2; y++) for(let x=2; x<n-2; x++) map[y][x] = 0;
    px = 5.5; py = 8.5; angle = -Math.PI/2;
    things = [{kind:'Ladder-Down', x: 5.5, y: 2.5, active: true}]; // Climb back down to advance
    
    // Fill with extra gems and coins
    for(let y=3; y<7; y++) for(let x=3; x<8; x++) {
       if(Math.random() < 0.4) things.push({kind:'Gem', x:x+0.5, y:y+0.5, active:true});
       else if(Math.random() < 0.3) things.push({kind:'OldCoin', x:x+0.5, y:y+0.5, active:true});
    }
    return;
  }

  // Significantly larger map grid for exploration (27x27 to 33x33)
  let n = 27 + (level % 3) * 3;
  map = Array.from({length: n}, () => Array(n).fill(1));
  let rooms = [];

  // Generate Rooms
  let numRooms = 7 + Math.floor(rand() * 5);
  for(let i = 0; i < numRooms * 4 && rooms.length < numRooms; i++) {
    let rw = 5 + Math.floor(rand() * 4) * 2; // Much wider rooms (5 to 11 size)
    let rh = 5 + Math.floor(rand() * 4) * 2;
    let rx = 1 + Math.floor(rand() * Math.floor((n - rw - 1) / 2)) * 2;
    let ry = 1 + Math.floor(rand() * Math.floor((n - rh - 1) / 2)) * 2;

    // Check overlap
    let overlap = false;
    for(let r of rooms) {
      if(rx < r.x + r.w + 1 && rx + rw + 1 > r.x && ry < r.y + r.h + 1 && ry + rh + 1 > r.y) {
        overlap = true; break;
      }
    }
    if(!overlap) {
      rooms.push({x: rx, y: ry, w: rw, h: rh, cx: rx + Math.floor(rw/2), cy: ry + Math.floor(rh/2)});
      for(let y = ry; y < ry + rh; y++) {
        for(let x = rx; x < rx + rw; x++) {
          map[y][x] = 0;
        }
      }
    }
  }

  // Connect Rooms via L-shaped Corridors (Wider Corridors)
  const safeCarve = (x, y) => { if (x > 0 && x < n-1 && y > 0 && y < n-1) map[y][x] = 0; };
  for(let i = 0; i < rooms.length - 1; i++) {
    let r1 = rooms[i], r2 = rooms[i+1];
    let cx = r1.cx, cy = r1.cy;
    let targetX = r2.cx, targetY = r2.cy;

    while(cx !== targetX) {
      safeCarve(cx, cy); safeCarve(cx, cy+1); safeCarve(cx, cy-1); // 3 blocks wide
      cx += Math.sign(targetX - cx);
    }
    while(cy !== targetY) {
      safeCarve(cx, cy); safeCarve(cx+1, cy); safeCarve(cx-1, cy); // 3 blocks wide
      cy += Math.sign(targetY - cy);
    }
    safeCarve(cx, cy);
  }

  // Set Player start in Room 0
  let startRoom = rooms[0] || {cx: 1, cy: 1};
  px = startRoom.cx + 0.5;
  py = startRoom.cy + 0.5;
  angle = 0;

  // Set Exit Door in furthest room
  let endRoom = rooms[rooms.length - 1] || {cx: n-2, cy: n-2};
  things = [{kind:'elevator', x: endRoom.cx + 0.5, y: endRoom.cy + 0.5, active: true}];

  // Gather available floor tiles across rooms and hallways
  let floors = [];
  for(let y=1; y<n-1; y++) {
    for(let x=1; x<n-1; x++) {
      if(map[y][x] === 0 && !(Math.floor(px) === x && Math.floor(py) === y)) {
        floors.push([x + 0.5, y + 0.5]);
      }
    }
  }

  const place = kind => {
    if(!floors.length) return;
    let i = Math.floor(rand() * floors.length), p = floors.splice(i,1)[0];
    things.push({kind, x: p[0], y: p[1], active: true, seed: Math.random()*1000, angle: Math.random()*Math.PI*2});
  };

  let totalLootValue = 0;
  while (totalLootValue < 4000 && floors.length > 15) {
    let r = rand();
    let kind = r < 0.2 ? 'Gem' : r < 0.5 ? 'Fossil' : r < 0.75 ? 'Flashlight' : 'OldCoin';
    place(kind);
    totalLootValue += itemValues[kind];
  }

  place('DonkeyUnicorn'); place('Astronaut');
  for(let i=0; i<3+Math.floor(level*0.8); i++) place('Moneygob');
  if(level >= 2) place('Green');
  if(level >= 3) place('Sun');
  
  // Occasionally spawn a ladder to the secret vents
  if(floors.length > 5 && Math.random() < 0.4) {
    place('Ladder');
  }
}

function wall(x,y) { return !map[Math.floor(y)] || map[Math.floor(y)][Math.floor(x)] !== 0; }

// Bounding box & Entity collision
function isFree(x, y, r) {
  if(wall(x-r, y-r) || wall(x+r, y-r) || wall(x-r, y+r) || wall(x+r, y+r)) return false;
  // Pufferfish actively block you from walking past them
  for(let t of things) {
    if(t.active && t.kind === 'Pufferfish' && Math.hypot(x - t.x, y - t.y) < 1.4) return false;
  }
  return true;
}

function move(dx,dy) {
  let nx = px + dx, ny = py + dy;
  let r = 0.25;
  if(isFree(nx, py, r)) px = nx;
  if(isFree(px, ny, r)) py = ny;
}
function distance(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }

function interact() {
  let t = things.filter(t => t.active && distance(t, {x:px, y:py}) < 1.45)
                .sort((a,b) => distance(a,{x:px,y:py}) - distance(b,{x:px,y:py}))[0];
  if(!t) { say('Nothing nearby.'); return; }
  
  if(t.kind === 'DonkeyUnicorn' || t.kind === 'Astronaut') { openTrade(t); return; }
  
  if(t.kind === 'elevator' || t.kind === 'door') {
    if(weapon === 'Crowbar' || inventory.includes('Crowbar')) {
      t.active = false; say('You pry open the elevator doors.'); nextLevel();
    } else say('The elevator is sealed. It needs a crowbar.');
    return;
  }
  if(t.kind === 'Ladder') {
    savedMap = map; savedThings = things; savedPx = px; savedPy = py; savedAngle = angle; savedType = levelType;
    t.active = false; say('You climb up the ladder into the dark vents...');
    levelType = 'SECRET'; makeMaze(); updateHud(); return;
  }
  if(t.kind === 'Ladder-Down') {
    t.active = false; say('You climb back down from the vents.');
    map = savedMap; things = savedThings; px = savedPx; py = savedPy; angle = savedAngle; levelType = savedType;
    updateHud(); return;
  }

  if(itemValues[t.kind]) {
    inventory.push(t.kind); t.active = false;
    say(t.kind + ' collected.'); updateHud(); return;
  }
  if(t.kind === 'Moneygob') {
    if(money >= 100) {
      money -= 100; t.active = false;
      say('Moneygob takes your $100 and scurries away.'); updateHud();
    } else say('Moneygob wants more cash. You need $100.');
  }
  if(t.kind === 'Green') {
    t.active = false; inventory.push('Gem');
    say('Green defeated — a gem drops!'); updateHud();
  }
  if(t.kind === 'Sun') say('The Sun is hiding in the vents. Keep moving!');
}

function openTrade(t) {
  paused = true;
  document.exitPointerLock?.();
  
  const isDonkey = t.kind === 'DonkeyUnicorn';
  $('tradeTitle').textContent = isDonkey ? 'Donkey Unicorn Trader' : 'Wandering Astronaut';
  $('tradeText').textContent = isDonkey ? 'Trade collected items for money.' : 'Buy a weapon with your money.';
  const box = $('tradeButtons'); box.innerHTML = '';
  
  if(isDonkey) {
    Object.keys(itemValues).forEach(item => {
      let count = inventory.filter(x => x === item).length;
      if(count) {
        let b = document.createElement('button');
        b.innerHTML = `<span>Sell ${item}</span> <strong>$${itemValues[item]}</strong>`;
        b.onclick = () => {
          inventory.splice(inventory.indexOf(item), 1); money += itemValues[item];
          updateHud(); openTrade(t); say(item + ' sold.');
        };
        box.appendChild(b);
      }
    });
    if(!box.children.length) box.textContent = 'No items to trade yet. Find loot on the floor.';
  } else {
    Object.entries(weaponPrices).forEach(([w, p]) => {
      let b = document.createElement('button');
      b.innerHTML = `<span>${w}</span> <strong>$${p}</strong>`;
      b.disabled = money < p;
      b.onclick = () => {
        money -= p; weapon = w; updateHud();
        say(w + ' purchased.'); $('trade').style.display = 'none';
        paused = false; safePointerLock();
      };
      box.appendChild(b);
    });
  }
  $('trade').style.display = 'flex';
}
$('closeTrade').onclick = () => { 
  $('trade').style.display = 'none'; 
  paused = false; 
  safePointerLock(); 
};

function updateHud() {
  $('healthNum').textContent = Math.ceil(health);
  $('healthBar').style.width = Math.max(0, health) + '%';
  $('staminaNum').textContent = Math.ceil(stamina);
  $('staminaBar').style.width = Math.max(0, stamina) + '%';
  $('levelNum').textContent = level;
  $('levelType').textContent = levelType;
  $('lives').textContent = lives;
  $('money').textContent = money;
  $('items').textContent = inventory.length + (weapon ? ' · ' + weapon : '');
}

function nextLevel() {
  if(level >= 7) {
    gameWon = true; running = false;
    $('overlay').style.display = 'flex';
    $('overlay').querySelector('h1').textContent = 'YOU ESCAPED';
    $('overlay').querySelector('p').textContent = 'You made it out of the basement. For now.';
    $('start').textContent = 'PLAY AGAIN';
    return;
  }
  level++; levelType = types[level-1]; health = 100; stamina = 100;
  inventory = []; weapon = null; money = 0;
  makeMaze(); say('Level ' + level + ': ' + levelType); updateHud();
}

function damage(n) {
  health -= n; camShake = Math.min(12, camShake + n * 0.5);
  if(health <= 0) {
    lives--;
    if(lives <= 0) {
      running = false; level = 1; lives = 3; money = 0; inventory = []; weapon = null; health = 100; stamina = 100;
      $('overlay').style.display = 'flex';
      $('overlay').querySelector('h1').textContent = 'GAME OVER';
      $('overlay').querySelector('p').textContent = 'The basement got the better of you. Try another run.';
      $('start').textContent = 'TRY AGAIN';
    } else {
      health = 100; inventory = []; money = Math.floor(money * 0.5);
      makeMaze(); say('You were caught. Level restarted.');
    }
  }
  updateHud();
}

function attack() {
  if(attackCooldown > 0) return;
  attackCooldown = 0.4; swingTime = 1.0;
  let range = weapon ? 1.7 : 1.15;
  let targets = things.filter(t => t.active && ['Moneygob','Green','Serpent','Wasp'].includes(t.kind) && distance(t, {x:px, y:py}) < range);
  let target = targets.find(t => {
    let a = Math.atan2(t.y - py, t.x - px);
    let d = Math.atan2(Math.sin(a - angle), Math.cos(a - angle));
    return Math.abs(d) < 0.9;
  });
  
  if(target) {
    target.active = false;
    camShake = 4;
    if(target.kind === 'Green') { inventory.push('Gem'); say('Green defeated — gem acquired.'); }
    else if(target.kind === 'Serpent') { say('You smashed the Blue Serpent!'); }
    else if(target.kind === 'Wasp') { say('You swatted the Wasp out of the air!'); }
    else say('You pushed the Moneygob away.');
    updateHud();
  } else say(weapon ? 'Swing!' : 'You need to get closer.');
}

function enemyAI(dt) {
  let dlevel = level * 1.5 - 0.5;
  let damageRate = levelType === 'BOILER' ? 13 : levelType === 'CLOSET' ? 8 : 5;
  for(let t of things) {
    if(!t.active) continue;
    if(t.kind === 'Moneygob' || t.kind === 'Green' || t.kind === 'Sun' || t.kind === 'Serpent' || t.kind === 'Wasp') {
      let d = distance(t, {x:px, y:py});
      let speed = t.kind === 'Serpent' ? 0.9 : t.kind === 'Wasp' ? 1.8 : t.kind === 'Green' ? 1.2 : t.kind === 'Sun' ? 1.0 : 0.58;
      if(d < 7) {
        let a = Math.atan2(py - t.y, px - t.x);
        let nx = t.x + Math.cos(a) * speed * dt;
        let ny = t.y + Math.sin(a) * speed * dt;
        if(!wall(nx, ny)) { t.x = nx; t.y = ny; }
      }
      
      if(t.kind === 'Serpent' && d < 0.8) { damage(100); say('A Blue Serpent devoured you!'); }
      else if(d < 0.65 && t.kind !== 'Serpent') damage(damageRate * dt * dlevel * (t.kind === 'Wasp' ? 0.5 : 0.25));
      
      if(t.kind === 'Sun' && d < 5 && rand() < dt * 0.15) { damage(8); say('The Sun blasts from a vent!'); }
    }
    else if(t.kind === 'Astronaut') {
      let speed = 0.5;
      let nx = t.x + Math.cos(t.angle) * speed * dt;
      let ny = t.y + Math.sin(t.angle) * speed * dt;
      if(!wall(nx, ny)) { t.x = nx; t.y = ny; }
      else { t.angle = rand() * Math.PI * 2; }
      if(rand() < dt * 0.5) t.angle += (rand() - 0.5) * 2;
    }
  }
}

// Draw Procedural High-Detail Sprites
function drawEntitySprite(ctx, kind, size, time, seed) {
  ctx.save();
  let bounce = Math.sin(time * 6 + seed) * size * 0.04;
  ctx.translate(0, bounce);

  if(kind === 'Moneygob') {
    // Red Goblin Body
    ctx.fillStyle = '#b71c1c';
    ctx.beginPath(); ctx.ellipse(0, -size*0.35, size*0.18, size*0.35, 0, 0, Math.PI*2); ctx.fill();
    
    // Goblin Pointy Ears
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath(); ctx.moveTo(-size*0.12, -size*0.55); ctx.lineTo(-size*0.4, -size*0.65); ctx.lineTo(-size*0.15, -size*0.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(size*0.12, -size*0.55); ctx.lineTo(size*0.4, -size*0.65); ctx.lineTo(size*0.15, -size*0.4); ctx.fill();

    // Leather Money Bag
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = size*0.03;
    ctx.beginPath(); ctx.moveTo(-size*0.12, -size*0.55); ctx.lineTo(size*0.18, -size*0.15); ctx.stroke();
    ctx.fillStyle = '#5d4037';
    ctx.beginPath(); ctx.roundRect(size*0.08, -size*0.28, size*0.18, size*0.18, size*0.04); ctx.fill();
    ctx.fillStyle = '#ffb300'; // gold buckle/coins spilling
    ctx.fillRect(size*0.13, -size*0.3, size*0.08, size*0.05);

    // Beady Yellow Eyes
    ctx.fillStyle = '#ffea00';
    ctx.beginPath(); ctx.arc(-size*0.06, -size*0.55, size*0.04, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.06, -size*0.55, size*0.04, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.arc(-size*0.06, -size*0.55, size*0.015, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.06, -size*0.55, size*0.015, 0, Math.PI*2); ctx.fill();

    // Toothy Grin
    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.ellipse(0, -size*0.42, size*0.08, size*0.04, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for(let i=-1; i<=1; i+=1) {
      ctx.beginPath(); ctx.moveTo(i*size*0.04, -size*0.42); ctx.lineTo(i*size*0.04 + size*0.02, -size*0.38); ctx.lineTo(i*size*0.04 + size*0.04, -size*0.42); ctx.fill();
    }
  }
  else if(kind === 'Green') {
    // Reptilian Skin Body
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.roundRect(-size*0.2, -size*0.65, size*0.4, size*0.65, 12); ctx.fill();
    ctx.fillStyle = '#43a047';
    ctx.beginPath(); ctx.roundRect(-size*0.16, -size*0.6, size*0.32, size*0.55, 8); ctx.fill();

    // Glowing Eyes & Spikes
    ctx.fillStyle = '#ff1744';
    ctx.shadowColor = '#ff1744'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-size*0.08, -size*0.52, size*0.04, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.08, -size*0.52, size*0.04, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Jaw & Jagged Teeth
    ctx.fillStyle = '#0d1f0d';
    ctx.beginPath(); ctx.rect(-size*0.1, -size*0.44, size*0.2, size*0.08); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for(let i=0; i<4; i++) {
      ctx.beginPath();
      ctx.moveTo(-size*0.08 + i*size*0.05, -size*0.44);
      ctx.lineTo(-size*0.065 + i*size*0.05, -size*0.39);
      ctx.lineTo(-size*0.05 + i*size*0.05, -size*0.44); ctx.fill();
    }
  }
  else if(kind === 'Sun') {
    // Blazing Outer Aura & Rays
    ctx.save();
    ctx.rotate(time * 0.8);
    ctx.fillStyle = '#ff9800';
    ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 15;
    for(let i=0; i<12; i++) {
      let a = (i/12)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*size*0.2, Math.sin(a)*size*0.2);
      ctx.lineTo(Math.cos(a+0.15)*size*0.36, Math.sin(a+0.15)*size*0.36);
      ctx.lineTo(Math.cos(a+0.3)*size*0.2, Math.sin(a+0.3)*size*0.2); ctx.fill();
    }
    ctx.restore();

    // Sun Disc
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.arc(0, 0, size*0.22, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Sinister Face
    ctx.fillStyle = '#212121';
    ctx.beginPath(); ctx.arc(-size*0.08, -size*0.05, size*0.035, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.08, -size*0.05, size*0.035, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, size*0.05, size*0.1, 0, Math.PI); ctx.fill();
  }
  else if(kind === 'Serpent') {
    ctx.save();
    ctx.fillStyle = '#0d47a1';
    ctx.shadowColor = '#1976d2'; ctx.shadowBlur = 10;
    for(let i=4; i>=0; i--) {
       let ox = Math.sin(time*5 + i)*size*0.1;
       ctx.beginPath();
       ctx.arc(ox, -size*(0.1 + i*0.15), size*(0.1 - i*0.01), 0, Math.PI*2);
       ctx.fill();
    }
    let hx = Math.sin(time*5)*size*0.1, hy = -size*0.7;
    ctx.fillStyle = '#1565c0';
    ctx.beginPath(); ctx.ellipse(hx, hy, size*0.15, size*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.arc(hx - size*0.06, hy - size*0.03, size*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + size*0.06, hy - size*0.03, size*0.03, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(hx - size*0.08, hy + size*0.05); ctx.lineTo(hx - size*0.04, hy + size*0.15); ctx.lineTo(hx, hy + size*0.05); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + size*0.08, hy + size*0.05); ctx.lineTo(hx + size*0.04, hy + size*0.15); ctx.lineTo(hx, hy + size*0.05); ctx.fill();
    ctx.restore();
  }
  else if(kind === 'DonkeyUnicorn') {
    // Donkey Body
    ctx.fillStyle = '#757575';
    ctx.beginPath(); ctx.ellipse(0, -size*0.32, size*0.22, size*0.32, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath(); ctx.ellipse(0, -size*0.28, size*0.13, size*0.2, 0, 0, Math.PI*2); ctx.fill();

    // Head & Snout
    ctx.fillStyle = '#9e9e9e';
    ctx.beginPath(); ctx.arc(0, -size*0.55, size*0.16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#eeeeee';
    ctx.beginPath(); ctx.ellipse(0, -size*0.48, size*0.12, size*0.08, 0, 0, Math.PI*2); ctx.fill();

    // Long Donkey Ears
    ctx.fillStyle = '#616161';
    ctx.beginPath(); ctx.ellipse(-size*0.1, -size*0.72, size*0.03, size*0.12, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(size*0.1, -size*0.72, size*0.03, size*0.12, 0.4, 0, Math.PI*2); ctx.fill();

    // Unicorn Horn (Magical!)
    ctx.fillStyle = '#ff4081';
    ctx.beginPath(); ctx.moveTo(-size*0.03, -size*0.65); ctx.lineTo(0, -size*0.9); ctx.lineTo(size*0.03, -size*0.65); ctx.fill();

    // Friendly Eyes
    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.arc(-size*0.06, -size*0.6, size*0.025, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.06, -size*0.6, size*0.025, 0, Math.PI*2); ctx.fill();
    
    // Trader Apron
    ctx.fillStyle = '#388e3c';
    ctx.fillRect(-size*0.12, -size*0.35, size*0.24, size*0.22);
  }
  else if(kind === 'Astronaut') {
    ctx.save();
    
    // Backpack / Oxygen Tank
    ctx.fillStyle = '#b0bec5';
    ctx.beginPath(); ctx.roundRect(-size*0.22, -size*0.7, size*0.44, size*0.4, size*0.05); ctx.fill();
    
    // Legs
    ctx.fillStyle = '#eceff1';
    ctx.strokeStyle = '#546e7a'; ctx.lineWidth = Math.max(1, size*0.015);
    ctx.beginPath(); ctx.roundRect(-size*0.14, -size*0.3, size*0.11, size*0.3, size*0.04); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(size*0.03, -size*0.3, size*0.11, size*0.3, size*0.04); ctx.fill(); ctx.stroke();

    // Arms
    ctx.beginPath(); ctx.roundRect(-size*0.26, -size*0.55, size*0.09, size*0.3, size*0.04); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(size*0.17, -size*0.55, size*0.09, size*0.3, size*0.04); ctx.fill(); ctx.stroke();

    // Torso (Classic bulky suit)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-size*0.2, -size*0.6);
    ctx.lineTo(size*0.2, -size*0.6);
    ctx.lineTo(size*0.16, -size*0.25);
    ctx.lineTo(-size*0.16, -size*0.25);
    ctx.fill(); ctx.stroke();

    // Chest Control Panel
    ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(-size*0.09, -size*0.52, size*0.18, size*0.16);
    ctx.strokeRect(-size*0.09, -size*0.52, size*0.18, size*0.16);
    ctx.fillStyle = '#f44336'; ctx.fillRect(-size*0.06, -size*0.48, size*0.04, size*0.04); // Red button
    ctx.fillStyle = '#2196f3'; ctx.fillRect(size*0.02, -size*0.48, size*0.04, size*0.04); // Blue button

    // Helmet (Spherical with gold visor)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, -size*0.75, size*0.18, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    
    // Gold Visor
    ctx.fillStyle = '#ffca28';
    ctx.beginPath(); ctx.ellipse(0, -size*0.76, size*0.13, size*0.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ff8f00'; ctx.lineWidth = Math.max(1, size*0.01); ctx.stroke();

    // Visor Glare
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath(); ctx.ellipse(-size*0.04, -size*0.8, size*0.06, size*0.03, -0.4, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }
  else if(kind === 'elevator' || kind === 'door') {
    // Metallic elevator doors
    ctx.fillStyle = '#607d8b'; ctx.fillRect(-size*0.3, -size*0.8, size*0.6, size*0.8);
    ctx.fillStyle = '#455a64'; ctx.fillRect(-size*0.3, -size*0.8, size*0.3, size*0.8); // left door
    ctx.fillStyle = '#546e7a'; ctx.fillRect(0, -size*0.8, size*0.3, size*0.8); // right door
    ctx.fillStyle = '#263238'; ctx.fillRect(-size*0.02, -size*0.8, size*0.04, size*0.8); // center gap
    // Button panel
    ctx.fillStyle = '#37474f'; ctx.fillRect(size*0.35, -size*0.4, size*0.1, size*0.2);
    ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(size*0.4, -size*0.3, size*0.02, 0, Math.PI*2); ctx.fill();
  }
  else if(kind === 'Ladder' || kind === 'Ladder-Down') {
    ctx.fillStyle = '#4e342e';
    ctx.fillRect(-size*0.15, -size*0.8, size*0.05, size*0.8);
    ctx.fillRect(size*0.1, -size*0.8, size*0.05, size*0.8);
    ctx.fillStyle = '#5d4037';
    for(let y=-size*0.7; y<0; y+=size*0.15) {
      ctx.fillRect(-size*0.1, y, size*0.2, size*0.03);
    }
    if (kind === 'Ladder-Down') {
       // Deep hole indication at the bottom of the ladder
       ctx.fillStyle = '#000000';
       ctx.beginPath(); ctx.ellipse(0, 0, size*0.3, size*0.1, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  else if (kind === 'Fossil') {
    ctx.fillStyle = '#d7ccc8';
    ctx.beginPath(); ctx.ellipse(0, -size*0.1, size*0.15, size*0.08, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-size*0.1, -size*0.15, size*0.06, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.1, -size*0.15, size*0.06, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8d6e63'; ctx.beginPath(); ctx.arc(0, -size*0.1, size*0.02, 0, Math.PI*2); ctx.fill();
  }
  else if (kind === 'OldCoin') {
    ctx.fillStyle = '#ffb300';
    ctx.beginPath(); ctx.ellipse(0, -size*0.15, size*0.12, size*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff8f00'; ctx.lineWidth = Math.max(1, size*0.02);
    ctx.beginPath(); ctx.ellipse(0, -size*0.15, size*0.09, size*0.09, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#ffe082'; ctx.fillRect(-size*0.02, -size*0.2, size*0.04, size*0.1);
  }
  else {
    // Default Loot Pickups (Gem, Flashlight)
    let hue = kind === 'Gem' ? '#00e5ff' : '#ffe082';
    ctx.fillStyle = hue; ctx.shadowColor = hue; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, -size*0.25, size*0.06, size*0.04, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function render() {
  // Clear Frame & Dynamic Overhead Bobbing
  ctx.clearRect(0, 0, W, H);
  let headBob = Math.sin(bobTime) * 6;
  let horizon = H/2 + headBob + pitch;
  
  if(camShake > 0) {
    ctx.save();
    ctx.translate((Math.random()-0.5)*camShake, (Math.random()-0.5)*camShake);
  }

  const texSet = textures[levelType] || textures.LIMINAL;

  // Ceiling Plane (Solid White with Distance Fog)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, horizon);
  for(let y=0; y<horizon; y+=8) {
      let depth = Math.pow(y / horizon, 2); // 0 at top, 1 at horizon
      ctx.fillStyle = `rgba(12, 16, 22, ${depth})`;
      ctx.fillRect(0, y, W, 8);
  }

  // Floor Plane (Solid Black with Distance Fog)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, horizon, W, H - horizon);
  for(let y=horizon; y<H; y+=8) {
      let depth = Math.pow(1 - ((y - horizon) / (H - horizon)), 2); // 1 at horizon, 0 at bottom
      ctx.fillStyle = `rgba(12, 16, 22, ${depth})`;
      ctx.fillRect(0, y, W, 8);
  }

  // Raycasting Walls
  const fov = Math.PI / 3, cols = Math.ceil(W / 2.5), step = W / cols;
  const texture = texSet.wall;
  zbuf = [];

  for(let i = 0; i < cols; i++) {
    let ray = angle - fov/2 + (i/cols) * fov;
    let hitDist = 0, side = 0, hitX = 0, hitY = 0;
    let rx = Math.cos(ray), ry = Math.sin(ray);

    for(let d = 0.04; d < 24; d += 0.02) {
      let x = px + rx * d, y = py + ry * d;
      if(wall(x,y)) {
        hitDist = d; hitX = x; hitY = y;
        side = Math.abs(x - Math.floor(x)) < 0.035 || Math.abs(x - Math.floor(x)) > 0.965 ? 0 : 1;
        break;
      }
    }

    if(!hitDist) hitDist = 24;
    let corrected = hitDist * Math.cos(ray - angle);
    zbuf[i] = corrected;

    let h = Math.min(H * 1.8, H / (corrected + 0.001));
    let top = (H - h) / 2 + headBob + pitch;

    let u = side ? hitY % 1 : hitX % 1;
    u = ((u % 1) + 1) % 1;
    let tx = Math.floor(u * texture.width);
    if((side ? ry : rx) > 0) tx = texture.width - 1 - tx;

    // Draw Wall Strip
    ctx.drawImage(texture, tx, 0, 1, texture.height, i*step, top, step+1, h);

    // Dynamic Distance & Flashlight Attenuation Light Fog
    let fogAmount = Math.min(1.0, corrected / 10.0);
    ctx.fillStyle = `rgba(12, 16, 22, ${fogAmount})`;
    ctx.fillRect(i*step, top, step+1, h);
    if (side) {
        ctx.fillStyle = `rgba(0, 0, 0, 0.35)`;
        ctx.fillRect(i*step, top, step+1, h);
    }
  }

  // Sorting & Rendering Billboards / Entities
  let visible = things.filter(t => t.active)
                      .map(t => ({...t, d: distance(t, {x:px, y:py}), a: Math.atan2(t.y - py, t.x - px)}))
                      .sort((a,b) => b.d - a.d);

  for(let t of visible) {
    let rel = Math.atan2(Math.sin(t.a - angle), Math.cos(t.a - angle));
    if(Math.abs(rel) > fov * 0.75 || t.d < 0.05) continue;

    let sx = W/2 + Math.tan(rel) / (Math.tan(fov/2)) * (W/2);
    let size = Math.min(H * 2.5, H / (t.d + 0.05) * 0.75);
    let col = Math.floor(sx / step);

    if(col >= 0 && col < zbuf.length && t.d > zbuf[col] + 0.15) continue;

    let y = horizon + size * 0.2;
    ctx.save();
    ctx.translate(sx, y);

    // Floor Drop Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.22, size * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // Render Character / Item
    drawEntitySprite(ctx, t.kind, size, last * 0.003, t.seed || 0);
    ctx.restore();
  }

  // Draw Floating Ambient Dust Particles
  ctx.fillStyle = 'rgba(255, 235, 200, 0.2)';
  for(let p of dustParticles) {
    let pX = (p.x * 100 + Math.sin(last*0.001*p.speed)*50) % W;
    let pY = (p.y * 100 + last*p.speed*20) % H;
    ctx.beginPath(); ctx.arc(pX, pY, p.size, 0, Math.PI*2); ctx.fill();
  }

  // Draw Weapon ViewModel & Swing Motion
  if(weapon) {
    ctx.save();
    let swingOffset = Math.sin(swingTime * Math.PI) * 40;
    ctx.translate(W * 0.75 - swingOffset, H * 0.75 + headBob + swingOffset*0.5 + pitch);

    // Weapon Shaft
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(-15, 0, 30, 200);
    ctx.fillStyle = '#212121';
    ctx.fillRect(-22, -40, 44, 45);

    if(weapon === 'Crowbar') {
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(-18, -90, 36, 60);
      ctx.beginPath(); ctx.arc(0, -90, 25, Math.PI, Math.PI*2); ctx.fill();
    } else if(weapon === 'Hammer') {
      ctx.fillStyle = '#78909c';
      ctx.fillRect(-45, -85, 90, 50);
    } else if(weapon === 'Bludgeon') {
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(-30, -110, 60, 80);
      ctx.fillStyle = '#b0bec5';
      for(let i=0; i<3; i++) ctx.fillRect(-25 + i*20, -100, 10, 10);
    }
    ctx.restore();
  }

  if(camShake > 0) ctx.restore();

  // --- Draw HUD Minimap ---
  if (map && map.length > 0) {
    let mScale = 4;
    let mW = map[0].length * mScale;
    let mH = map.length * mScale;
    let mX = 20, mY = H - mH - 20; // Bottom left corner

    ctx.fillStyle = 'rgba(14, 16, 22, 0.85)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mX - 10, mY - 10, mW + 20, mH + 20, 8); 
    ctx.fill(); ctx.stroke();

    // Draw Map Walls
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    for(let y=0; y<map.length; y++) {
      for(let x=0; x<map[y].length; x++) {
        if(map[y][x] !== 0) {
          ctx.fillRect(mX + x*mScale, mY + y*mScale, mScale, mScale);
        }
      }
    }

    // Draw Entities on Minimap
    for(let t of things) {
      if(!t.active) continue;
      if(['Moneygob', 'Green', 'Sun', 'Serpent', 'Wasp'].includes(t.kind)) ctx.fillStyle = '#ff5252'; // Enemies Red
      else if(['elevator', 'door', 'Ladder', 'Ladder-Down'].includes(t.kind)) ctx.fillStyle = '#ffe082'; // Objectives Gold
      else continue;
      ctx.fillRect(mX + t.x*mScale - 1.5, mY + t.y*mScale - 1.5, 3, 3);
    }

    // Draw Player on Minimap
    ctx.fillStyle = '#45d483';
    ctx.beginPath(); ctx.arc(mX + px*mScale, mY + py*mScale, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mX + px*mScale, mY + py*mScale);
    ctx.lineTo(mX + px*mScale + Math.cos(angle)*7, mY + py*mScale + Math.sin(angle)*7);
    ctx.strokeStyle = '#45d483'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function loop(ts) {
  let dt = Math.min(0.04, (ts - last) / 1000 || 0);
  last = ts;

  if(running && !paused) {
    let sprint = keys.ShiftLeft || keys.ShiftRight;
    let spd = sprint && stamina > 0 ? 3.6 : 2.2;

    if(sprint && stamina > 0) stamina = Math.max(0, stamina - 28 * dt);
    else stamina = Math.min(100, stamina + 18 * dt);

    let forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    let strafe = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let dx = (Math.cos(angle)*forward - Math.sin(angle)*strafe) * spd * dt;
    let dy = (Math.sin(angle)*forward + Math.cos(angle)*strafe) * spd * dt;

    if(forward || strafe) {
      move(dx, dy);
      bobTime += dt * (sprint ? 14 : 9);
    } else {
      bobTime = 0;
    }

    if(swingTime > 0) swingTime = Math.max(0, swingTime - dt * 4);
    if(camShake > 0) camShake = Math.max(0, camShake - dt * 25);

    enemyAI(dt);
    attackCooldown = Math.max(0, attackCooldown - dt);

    let t = things.filter(t => t.active && distance(t, {x:px, y:py}) < 1.5)
                  .sort((a,b) => distance(a, {x:px, y:py}) - distance(b, {x:px, y:py}))[0];
    nearby = t;
    $('prompt').style.display = t ? 'block' : 'none';
    if(t) {
      $('prompt').textContent = (t.kind === 'elevator' || t.kind === 'door' ? 'E · Pry open elevator (crowbar)' :
                                 t.kind === 'Ladder' ? 'E · Climb up ladder' :
                                 t.kind === 'Ladder-Down' ? 'E · Climb down ladder' :
                                 t.kind === 'DonkeyUnicorn' ? 'E · Trade items' :
                                 t.kind === 'Astronaut' ? 'E · Buy weapons' :
                                 t.kind === 'Moneygob' ? 'E · Pay off Moneygob ($100)' :
                                 t.kind === 'Green' ? 'E · Interact' : 'E · Pick up ' + t.kind);
    }

    if(toastTimer > 0) {
      toastTimer -= dt;
      if(toastTimer <= 0) $('toast').style.display = 'none';
    }
    updateHud();
  }

  render();
  requestAnimationFrame(loop);
}

function start() {
  level = 1; lives = 3; money = 0; health = 100; stamina = 100;
  inventory = []; weapon = null; gameWon = false;
  levelType = types[0];
  makeMaze();
  $('overlay').style.display = 'none';
  $('hud').style.display = 'flex';
  $('crosshair').style.display = 'block';
  running = true; paused = false;
  updateHud();
  safePointerLock();
  say('Find a Donkey Unicorn, buy a crowbar, then locate the secret elevator.');
}

$('start').onclick = () => {
  startMusic();
  if(gameWon || !running) start();
  else { running = true; paused = false; $('overlay').style.display = 'none'; }
};

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'KeyE' && running && !paused) interact();
  if(e.code === 'Space' && running && !paused) { e.preventDefault(); attack(); }
  if(e.code === 'Escape' && running) {
    paused = !paused;
    $('overlay').style.display = paused ? 'flex' : 'none';
    $('overlay').querySelector('h1').textContent = paused ? 'PAUSED' : 'MONEYGOB RUN';
    $('overlay').querySelector('p').textContent = paused ? 'Take a breather. The basement can wait.' : 'Somewhere underneath the basement, the corridors keep changing.';
    $('start').textContent = paused ? 'RESUME' : 'PUSH TO PLAY';
  }
});

document.addEventListener('keyup', e => keys[e.code] = false);
document.addEventListener('mousemove', e => {
  if(document.pointerLockElement === canvas && running && !paused) {
    angle += e.movementX * 0.0025;
    pitch -= e.movementY * 1.5;
    pitch = Math.max(-H*0.4, Math.min(H*0.4, pitch));
  }
});
canvas.addEventListener('click', () => {
  if(running && !paused) safePointerLock();
});

updateHud();
requestAnimationFrame(loop);
})();
</script>
</body>
